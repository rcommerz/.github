name: Run Tests

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-user-service:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: xdebug
      
      - name: Install dependencies
        working-directory: ./services/user-service
        run: composer install --prefer-dist --no-progress
      
      - name: Run tests
        working-directory: ./services/user-service
        run: php artisan test --coverage
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: test_db
          DB_USERNAME: root
          DB_PASSWORD: root

  test-product-service:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./services/product-service/package-lock.json
      
      - name: Install dependencies
        working-directory: ./services/product-service
        run: npm ci
      
      - name: Run tests
        working-directory: ./services/product-service
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/test_products
          NODE_ENV: test

  test-cart-service:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: ./services/cart-service/go.sum
      
      - name: Install dependencies
        working-directory: ./services/cart-service
        run: go mod download
      
      - name: Run tests
        working-directory: ./services/cart-service
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  test-storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./services/storefront/package-lock.json
      
      - name: Install dependencies
        working-directory: ./services/storefront
        run: npm ci
      
      - name: Run linting
        working-directory: ./services/storefront
        run: npm run lint
      
      - name: Run type checking
        working-directory: ./services/storefront
        run: npm run type-check || npx tsc --noEmit
      
      - name: Build
        working-directory: ./services/storefront
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
